<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var note = document.getElementById('note'), pw = document.getElementById('pw'), go = document.getElementById('go');
  function b64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  async function open_(pass){
    note.className='note'; note.textContent='Decrypting';
    try{
      var enc=new TextEncoder();
      var base=await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
      var key=await crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      var plain=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.nonce)}, key, b64(P.ct));
      var html=new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    }catch(e){
      note.className='note err'; note.textContent='That passphrase did not work.';
      pw.value=''; pw.focus();
    }
  }
  go.addEventListener('click', function(){ if(pw.value) open_(pw.value); });
  pw.addEventListener('keydown', function(e){ if(e.key==='Enter' && pw.value) open_(pw.value); });
  var frag=(location.hash||'').replace(/^#k=/,'');
  if(frag){ open_(decodeURIComponent(frag)); } else { pw.focus(); }
})();
</script>
